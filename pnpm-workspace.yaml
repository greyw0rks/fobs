packages:
  - "apps/*"

# pnpm 10+ blocks postinstall scripts by default. These all need theirs to
# fetch/compile native binaries; without them Prisma and Next fail at runtime.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@stellar/stellar-sdk': set this to true or false
  bigint-buffer: true
  blake-hash: set this to true or false
  bufferutil: true
  esbuild: true
  prisma: true
  protobufjs: set this to true or false
  tiny-secp256k1: set this to true or false
  unrs-resolver: true
  usb: set this to true or false
  utf-8-validate: true
