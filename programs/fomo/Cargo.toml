[package]
name = "fomo"
version = "0.1.0"
description = "FOBS synthetic social stock market program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fomo"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
# Required by Anchor 0.30's `anchor build` to emit target/idl/fomo.json.
# Without it the build succeeds but no IDL is produced, and the web client has
# nothing to build transactions from.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
